[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdwisdom-macro"
version = "0.1.0"
description = "A walk-forward macro event trading research pipeline"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
